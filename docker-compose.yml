version: '3.8'

services:
  app:
    build: .
    container_name: skating-analysis
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://skating_user:skating_pass@db:5432/skating_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - skating-network

  db:
    image: postgres:15-alpine
    container_name: skating-db
    environment:
      - POSTGRES_DB=skating_db
      - POSTGRES_USER=skating_user
      - POSTGRES_PASSWORD=skating_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - skating-network

  redis:
    image: redis:7-alpine
    container_name: skating-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - skating-network

networks:
  skating-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
